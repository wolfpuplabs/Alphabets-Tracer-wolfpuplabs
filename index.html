<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tracing Dots to AR - Spatial Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --bg-color: #E2F3F5;
            --card-bg: rgba(255, 255, 255, 0.85);
            --primary-pink: #FF6B9D;
            --primary-cyan: #00F0FF;
            --primary-yellow: #FFDE59;
            --primary-purple: #8C52FF;
            --text-color: #2D1E2F;
            --stroke-color: #1A102F;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #C1F0F6;
            background-image: 
                radial-gradient(circle at 15% 20%, #FFF066 0%, transparent 20%),
                radial-gradient(circle at 85% 80%, #FF99C8 0%, transparent 25%),
                radial-gradient(circle at 50% 50%, #A0C4FF 0%, transparent 50%);
            background-attachment: fixed;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: var(--text-color);
            perspective: 1000px;
        }

        .lang-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #FFFFFF;
            border: 3px solid var(--stroke-color);
            border-radius: 20px;
            padding: 8px 18px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 800;
            font-size: 16px;
            color: var(--stroke-color);
            cursor: pointer;
            box-shadow: 0 6px 0 var(--stroke-color);
            transition: all 0.15s ease;
            z-index: 100;
        }
        .lang-toggle:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--stroke-color); }

        .card-container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 4px solid #FFFFFF;
            outline: 4px solid var(--stroke-color);
            border-radius: 40px;
            box-shadow: 0 20px 0 var(--stroke-color), 0 30px 40px rgba(0, 0, 0, 0.15); 
            padding: 25px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 90%;
            width: 380px; 
            box-sizing: border-box;
            position: relative;
        }

        #step2-voice, #step3-ar {
            display: none;
        }

        #tracingCanvas {
            border: 4px dashed var(--primary-purple);
            border-radius: 28px;
            touch-action: none; 
            cursor: crosshair;
            background-color: #FFFFFF; 
            background-image: url('letter_a_trace.png'); 
            background-size: 100% 100%; 
            background-position: center;
            background-repeat: no-repeat;
            margin-top: 10px;
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.06);
            max-width: 100%;
        }

        model-viewer {
            width: 100%;
            height: 240px;
            background: radial-gradient(circle, #FFFFFF 0%, #E2F3F5 100%);
            border: 4px solid var(--stroke-color);
            border-radius: 28px;
            margin-bottom: 20px;
        }

        h2 { 
            margin: 0 0 5px 0; 
            font-size: 30px; 
            font-weight: 800;
            color: var(--primary-pink); 
            text-shadow: 3px 3px 0 var(--stroke-color);
            -webkit-text-stroke: 1.5px var(--stroke-color);
            letter-spacing: 1px;
        }

        p { 
            margin: 0 0 15px 0; 
            font-size: 16px; 
            font-weight: 600;
            color: #4A4E69; 
        }

        .big-letter {
            font-size: 90px; 
            font-weight: 800; 
            color: var(--primary-yellow); 
            margin: 0px 0 15px 0;
            line-height: 1;
            text-shadow: 
                4px 4px 0 var(--stroke-color),
                -2px -2px 0 var(--stroke-color),
                2px -2px 0 var(--stroke-color),
                -2px 2px 0 var(--stroke-color);
            animation: floatLetter 3s ease-in-out infinite;
        }

        @keyframes floatLetter {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }

        .btn-group {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn {
            font-family: 'Fredoka', sans-serif;
            color: white;
            border: 3px solid var(--stroke-color);
            padding: 14px;
            border-radius: 22px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--stroke-color);
            transition: all 0.1s ease;
            flex: 1;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active { 
            transform: translateY(6px); 
            box-shadow: 0 0 0 var(--stroke-color); 
        }

        .btn-sound { background-color: var(--primary-cyan); color: #004E64; } 
        .btn-speak { background-color: var(--primary-yellow); color: #5F4B00; } 
        .btn-retry { background-color: var(--primary-pink); width: 100%; } 
        
        .btn-speak.recording { 
            background-color: #FF477E; 
            color: white; 
            box-shadow: 0 0 0 var(--stroke-color);
            transform: translateY(6px);
            animation: pulseGlow 1.2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0px rgba(255, 71, 126, 0.7); }
            100% { box-shadow: 0 0 0 15px rgba(255, 71, 126, 0); }
        }

        #voiceFeedback {
            margin-top: 8px;
            font-size: 15px;
            font-weight: 700;
            min-height: 24px;
            padding: 4px 10px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <audio id="audioCheer" src="https://www.myinstants.com/media/sounds/yay_zP2XQOU.mp3" preload="auto"></audio>
    <audio id="audioFail" src="https://www.myinstants.com/media/sounds/erro.mp3" preload="auto"></audio>

    <button id="langBtn" class="lang-toggle">ID 🇮🇩</button>

    <div id="step1-tracing" class="card-container">
        <h2 id="txt-step1">Langkah 1</h2>
        <p id="txt-desc1">Hubungkan semua titik pada huruf A</p>
        <canvas id="tracingCanvas" width="340" height="380"></canvas>
    </div>

    <div id="step2-voice" class="card-container">
        <h2 id="txt-step2">Langkah 2</h2>
        <p id="txt-desc2">Dengarkan lalu ucapkan hurufnya!</p>
        <div class="big-letter">Aa</div>
        <div class="btn-group">
            <button class="btn btn-sound" id="playSoundBtn">🔊 Dengar</button>
            <button class="btn btn-speak" id="speakBtn">🎙️ Ucapkan</button>
        </div>
        <div id="voiceFeedback"></div>
    </div>

    <div id="step3-ar" class="card-container">
        <h2 id="txt-step3">Luar Biasa!</h2>
        <p id="txt-desc3">Lihat huruf A secara AR di sekitarmu!</p>
        
        <model-viewer 
            src="letter_A.glb" 
            alt="Model 3D Huruf A" 
            auto-rotate 
            camera-controls 
            ar 
            ar-modes="webxr scene-viewer quick-look">
        </model-viewer>

        <button class="btn btn-retry" id="retryBtn">🔄 Ulangi dari Awal</button>
    </div>

    <script>
        const i18n = {
            id: {
                step1: "Langkah 1", desc1: "Hubungkan semua titik pada huruf A",
                step2: "Langkah 2", desc2: "Dengarkan lalu ucapkan hurufnya!",
                listen: "🔊 Dengar", speak: "🎙️ Ucapkan",
                step3: "Luar Biasa!", desc3: "Lihat huruf A secara AR di sekitarmu!",
                retry: "🔄 Ulangi dari Awal",
                listening: "Mendengarkan...", success: "🎉 Hebat! Suaramu Mantap!",
                failText: "Kamu bilang: ", failTryAgain: " Coba lagi ya!",
                error: "Suara kurang jelas, coba lagi ya!",
                ttsLetter: "a",
                langCode: "id-ID"
            },
            en: {
                step1: "Step 1", desc1: "Connect all the dots on the letter A",
                step2: "Step 2", desc2: "Listen and then say the letter!",
                listen: "🔊 Listen", speak: "🎙️ Say It",
                step3: "Awesome!", desc3: "View the letter A in AR around you!",
                retry: "🔄 Start Over",
                listening: "Listening...", success: "🎉 Awesome! Great job!",
                failText: "You said: ", failTryAgain: " Try again!",
                error: "Didn't catch that, try again!",
                ttsLetter: "a",
                langCode: "en-US"
            }
        };

        let currentLang = 'id';
        const langBtn = document.getElementById('langBtn');

        function applyLanguage() {
            const t = i18n[currentLang];
            document.getElementById('txt-step1').innerText = t.step1;
            document.getElementById('txt-desc1').innerText = t.desc1;
            document.getElementById('txt-step2').innerText = t.step2;
            document.getElementById('txt-desc2').innerText = t.desc2;
            document.getElementById('playSoundBtn').innerText = t.listen;
            document.getElementById('speakBtn').innerText = t.speak;
            document.getElementById('txt-step3').innerText = t.step3;
            document.getElementById('txt-desc3').innerText = t.desc3;
            document.getElementById('retryBtn').innerText = t.retry;
            document.getElementById('voiceFeedback').innerText = "";
            langBtn.innerText = currentLang === 'id' ? 'ID 🇮🇩' : 'EN 🇬🇧';
        }

        langBtn.addEventListener('click', () => {
            currentLang = currentLang === 'id' ? 'en' : 'id';
            applyLanguage();
        });

        // --- AUDIO & CONFETTI ---
        const audioCheer = document.getElementById('audioCheer');
        const audioFail = document.getElementById('audioFail');
        let mediaUnlocked = false;

        function unlockMedia() {
            if (!mediaUnlocked) {
                const unlockMsg = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(unlockMsg);
                audioCheer.play().then(() => audioCheer.pause()).catch(e => {});
                audioFail.play().then(() => audioFail.pause()).catch(e => {});
                mediaUnlocked = true;
            }
        }

        window.addEventListener('touchstart', unlockMedia, { passive: true, once: true });
        window.addEventListener('mousedown', unlockMedia, { passive: true, once: true });

        function playSuccessSFX() {
            audioCheer.currentTime = 0;
            audioCheer.play().catch(e => {});
            confetti({
                particleCount: 120,
                spread: 90,
                origin: { y: 0.65 },
                colors: ['#00F0FF', '#FFDE59', '#FF6B9D', '#8C52FF'],
                zIndex: 9999
            });
        }

        function playFailSFX() {
            audioFail.currentTime = 0;
            audioFail.play().catch(e => {});
        }

        function playLetterSound() {
            const t = i18n[currentLang];
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t.ttsLetter);
            msg.lang = t.langCode;
            msg.rate = 0.8;
            window.speechSynthesis.speak(msg);
        }

        // --- NAVIGATION ---
        const step1 = document.getElementById('step1-tracing');
        const step2 = document.getElementById('step2-voice');
        const step3 = document.getElementById('step3-ar');

        function goToStep(stepNum) {
            step1.style.display = 'none';
            step2.style.display = 'none';
            step3.style.display = 'none';
            if(stepNum === 1) step1.style.display = 'flex';
            if(stepNum === 2) step2.style.display = 'flex';
            if(stepNum === 3) step3.style.display = 'flex';
        }

        // --- TRACING CANVAS ---
        const canvas = document.getElementById('tracingCanvas');
        const ctx = canvas.getContext('2d');
        
        let isDrawing = false;
        let isTracingComplete = false;
        let strokes = []; 
        let currentStroke = []; 

        let checkpoints = [
            { x: 170, y: 60, hit: false },   
            { x: 110, y: 220, hit: false },  
            { x: 170, y: 220, hit: false },  
            { x: 230, y: 220, hit: false },  
            { x: 60, y: 330, hit: false },   
            { x: 280, y: 330, hit: false }   
        ];

        function resetCanvas() {
            checkpoints.forEach(pt => pt.hit = false);
            strokes = [];
            currentStroke = [];
            isTracingComplete = false;
            redrawAll();
        }

        function redrawAll() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            checkpoints.forEach(pt => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 14, 0, Math.PI * 2);
                ctx.fillStyle = pt.hit ? '#FFDE59' : '#C1F0F6'; 
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#1A102F';
                ctx.stroke();

                if(pt.hit) {
                    ctx.beginPath();
                    ctx.arc(pt.x - 3, pt.y - 3, 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fill();
                }
            });

            ctx.lineWidth = 20; 
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#8C52FF';

            strokes.forEach(stroke => {
                if (stroke.length === 0) return;
                ctx.beginPath();
                ctx.moveTo(stroke[0].x, stroke[0].y);
                for (let i = 1; i < stroke.length; i++) {
                    ctx.lineTo(stroke[i].x, stroke[i].y);
                }
                ctx.stroke();
            });

            if (isDrawing && currentStroke.length > 0) {
                ctx.beginPath();
                ctx.moveTo(currentStroke[0].x, currentStroke[0].y);
                for (let i = 1; i < currentStroke.length; i++) {
                    ctx.lineTo(currentStroke[i].x, currentStroke[i].y);
                }
                ctx.stroke();
            }
        }

        redrawAll();

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function startDrawing(e) {
            if (isTracingComplete) return;
            e.preventDefault(); 
            isDrawing = true;
            const pos = getCoordinates(e);
            currentStroke = [pos];
            redrawAll();
        }

        function stopDrawing(e) {
            if (e) e.preventDefault();
            if (isDrawing) {
                strokes.push(currentStroke);
                isDrawing = false;
                currentStroke = [];
            }
        }

        function draw(e) {
            if (!isDrawing || isTracingComplete) return;
            e.preventDefault();
            const pos = getCoordinates(e);
            currentStroke.push(pos);
            checkHit(pos.x, pos.y);
            redrawAll(); 
        }

        function checkHit(x, y) {
            let hitOccurred = false;
            checkpoints.forEach(pt => {
                const dist = Math.hypot(pt.x - x, pt.y - y);
                if (dist < 32 && !pt.hit) {
                    pt.hit = true;
                    hitOccurred = true;
                }
            });

            if (hitOccurred) {
                const allHit = checkpoints.every(pt => pt.hit === true);
                if (allHit) {
                    isTracingComplete = true; 
                    stopDrawing(); 
                    playSuccessSFX(); 
                    setTimeout(() => { goToStep(2); }, 2000); 
                }
            }
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', startDrawing, {passive: false});
        canvas.addEventListener('touchend', stopDrawing, {passive: false});
        canvas.addEventListener('touchmove', draw, {passive: false});


        // --- LOGIKA VOICE RECOGNITION (FIX TERKUNCI & LEBIH MUDAH) ---
        const speakBtn = document.getElementById('speakBtn');
        const playSoundBtn = document.getElementById('playSoundBtn');
        const voiceFeedback = document.getElementById('voiceFeedback');

        playSoundBtn.addEventListener('click', playLetterSound);

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            
            // Matikan interimResults agar proses lebih stabil di mobile & tidak bug
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.maxAlternatives = 5;

            let isRecording = false;

            // Fungsi Reset Tombol yang dijamin SELALU jalan
            const resetBtnState = () => {
                isRecording = false;
                speakBtn.classList.remove('recording');
                speakBtn.innerText = i18n[currentLang].speak;
            };

            speakBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (isRecording) return;

                unlockMedia();
                const t = i18n[currentLang];
                recognition.lang = t.langCode;
                
                try {
                    recognition.start();
                    isRecording = true;
                    speakBtn.classList.add('recording');
                    speakBtn.innerText = t.listening;
                    voiceFeedback.innerText = "";
                    voiceFeedback.style.backgroundColor = "transparent";
                } catch (err) {
                    resetBtnState();
                }
            });

            recognition.onresult = (event) => {
                resetBtnState();
                const t = i18n[currentLang];
                let isCorrect = false;
                let capturedText = "";

                // Cek semua variasi tangkapan suara
                for (let i = 0; i < event.results[0].length; i++) {
                    capturedText = event.results[0][i].transcript.toLowerCase().trim();
                    
                    // Toleransi tinggi untuk anak: jika mendengar huruf A atau ucapan singkat apapun
                    if (capturedText.length > 0) {
                        isCorrect = true; // Langsung anggap benar jika anak mengeluarkan suara
                        break;
                    }
                }

                if (isCorrect) {
                    voiceFeedback.innerText = t.success;
                    voiceFeedback.style.color = "#008000"; 
                    voiceFeedback.style.backgroundColor = "#E8F5E9";
                    playSuccessSFX(); 
                    setTimeout(() => { goToStep(3); }, 2000);
                } else {
                    voiceFeedback.innerText = t.failText + `"${capturedText}".` + t.failTryAgain;
                    voiceFeedback.style.color = "#D8000C";
                    voiceFeedback.style.backgroundColor = "#FFD2D2";
                    playFailSFX(); 
                }
            };

            // Event saat perekaman berhenti otomatis/selesai
            recognition.onend = () => {
                resetBtnState();
            };

            // Event saat terjadi error
            recognition.onerror = (event) => {
                resetBtnState();
                const t = i18n[currentLang];
                
                if (event.error === 'no-speech') {
                    voiceFeedback.innerText = t.error;
                } else if (event.error === 'not-allowed') {
                    voiceFeedback.innerText = "Buka izin mikrofon di browsermu ya!";
                } else {
                    voiceFeedback.innerText = t.error;
                }
                
                voiceFeedback.style.color = "#D8000C";
                voiceFeedback.style.backgroundColor = "#FFD2D2";
            };

        } else {
            speakBtn.style.display = 'none';
            voiceFeedback.innerText = "Browser tidak mendukung rekam suara";
        }

        // --- ULANGI (STEP 3) ---
        const retryBtn = document.getElementById('retryBtn');
        retryBtn.addEventListener('click', () => {
            resetCanvas();
            voiceFeedback.innerText = "";
            voiceFeedback.style.backgroundColor = "transparent";
            goToStep(1);
        });
    </script>
</body>
</html>
