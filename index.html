<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tracing Dots to AR</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Import Library 3D dan Confetti (Pinata Effect) -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #FEE440; 
            background-image: radial-gradient(circle, #FFF07C 20%, transparent 20%), radial-gradient(circle, #FFF07C 20%, transparent 20%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: #2B2D42;
        }

        .lang-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #FFFFFF;
            border: 4px solid #2B2D42;
            border-radius: 15px;
            padding: 8px 15px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 0 #2B2D42;
            transition: transform 0.1s;
            z-index: 100;
        }
        .lang-toggle:active { transform: translateY(4px); box-shadow: 0 0 0 #2B2D42; }

        .card-container {
            background: #FFFFFF;
            border: 5px solid #2B2D42;
            border-radius: 30px;
            box-shadow: 0 12px 0 #2B2D42; 
            padding: 30px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 95%;
            width: 400px; 
            box-sizing: border-box;
            position: relative;
        }

        #step2-voice, #step3-ar {
            display: none;
        }

        #tracingCanvas {
            border: 4px dashed #00BBF9;
            border-radius: 20px;
            touch-action: none; 
            cursor: crosshair;
            background-color: #F8F9FA; 
            background-image: url('letter_a_trace.png'); 
            background-size: 100% 100%; 
            background-position: center;
            background-repeat: no-repeat;
            margin-top: 10px;
            max-width: 100%;
        }

        model-viewer {
            width: 100%;
            height: 250px;
            background-color: #E5E5EA;
            border: 4px solid #2B2D42;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        h2 { 
            margin: 0 0 10px 0; 
            font-size: 28px; 
            font-weight: 700;
            color: #F15BB5; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p { 
            margin: 0 0 15px 0; 
            font-size: 16px; 
            font-weight: 500;
            color: #6C757D; 
        }

        .big-letter {
            font-size: 80px; 
            font-weight: 700; 
            color: #F15BB5; 
            margin: 10px 0 20px 0;
            line-height: 1;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-bottom: 12px;
        }

        .btn {
            font-family: 'Fredoka', sans-serif;
            color: white;
            border: 4px solid #2B2D42;
            padding: 14px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 0 #2B2D42;
            transition: all 0.1s;
            flex: 1;
            text-transform: uppercase;
        }

        .btn:active { 
            transform: translateY(6px); 
            box-shadow: 0 0 0 #2B2D42; 
        }

        .btn-sound { background-color: #00BBF9; } 
        .btn-speak { background-color: #00F5D4; color: #2B2D42; } 
        .btn-retry { background-color: #F15BB5; width: 100%; } 
        
        .btn-speak.recording { 
            background-color: #FF3366; 
            color: white; 
            pointer-events: none; 
            box-shadow: 0 0 0 #2B2D42;
            transform: translateY(6px);
        }

        #voiceFeedback {
            margin-top: 10px;
            font-size: 16px;
            font-weight: 600;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <!-- Audio Files: Menggunakan URL MP3 yang sangat kompatibel dengan Safari iOS -->
    <audio id="audioCheer" src="https://www.myinstants.com/media/sounds/yay_zP2XQOU.mp3" preload="auto"></audio>
    <audio id="audioFail" src="https://www.myinstants.com/media/sounds/erro.mp3" preload="auto"></audio>

    <button id="langBtn" class="lang-toggle">ID 🇮🇩</button>

    <!-- STEP 1: TRACING -->
    <div id="step1-tracing" class="card-container">
        <h2 id="txt-step1">Langkah 1</h2>
        <p id="txt-desc1">Hubungkan semua titik pada huruf A</p>
        <canvas id="tracingCanvas" width="350" height="400"></canvas>
    </div>

    <!-- STEP 2: VOICE -->
    <div id="step2-voice" class="card-container">
        <h2 id="txt-step2">Langkah 2</h2>
        <p id="txt-desc2">Dengarkan lalu ucapkan hurufnya!</p>
        <div class="big-letter">Aa</div>
        <div class="btn-group">
            <button class="btn btn-sound" id="playSoundBtn">Dengar</button>
            <button class="btn btn-speak" id="speakBtn">Ucapkan</button>
        </div>
        <div id="voiceFeedback"></div>
    </div>

    <!-- STEP 3: AR -->
    <div id="step3-ar" class="card-container">
        <h2 id="txt-step3">Luar Biasa!</h2>
        <p id="txt-desc3">Lihat huruf A secara AR di sekitarmu!</p>
        
        <model-viewer 
            src="letter_A.glb" 
            alt="Model 3D Huruf A" 
            auto-rotate 
            camera-controls 
            ar 
            ar-modes="webxr scene-viewer quick-look">
        </model-viewer>

        <button class="btn btn-retry" id="retryBtn">Ulangi dari Awal</button>
    </div>

    <script>
        // --- DICTIONARY & LANGUAGE TOGGLE ---
        const i18n = {
            id: {
                step1: "Langkah 1", desc1: "Hubungkan semua titik pada huruf A",
                step2: "Langkah 2", desc2: "Dengarkan lalu ucapkan hurufnya!",
                listen: "Dengar", speak: "Ucapkan",
                step3: "Luar Biasa!", desc3: "Lihat huruf A secara AR di sekitarmu!",
                retry: "Ulangi dari Awal",
                listening: "Mendengar...", success: "Hebat! Itu huruf A",
                failText: "Kamu bilang: ", failTryAgain: " Coba lagi ya",
                error: "Suaranya kurang jelas, coba lagi ya",
                micError: "Ketuk 'Ucapkan' sekali lagi ya!",
                ttsLetter: "a", // Huruf a biasa
                langCode: "id-ID",
                validWords: ['a', 'ah', 'ha', 'aa', 'eh', 'kak']
            },
            en: {
                step1: "Step 1", desc1: "Connect all the dots on the letter A",
                step2: "Step 2", desc2: "Listen and then say the letter!",
                listen: "Listen", speak: "Say It",
                step3: "Awesome!", desc3: "View the letter A in AR around you!",
                retry: "Start Over",
                listening: "Listening...", success: "Great! That's the letter A",
                failText: "You said: ", failTryAgain: " Try again",
                error: "Sound not clear, please try again",
                micError: "Tap 'Say It' one more time!",
                ttsLetter: "a", // Menggunakan huruf a kecil untuk menghindari "Capital"
                langCode: "en-US",
                // Diperluas agar pendeteksian bahasa Inggris lebih mudah untuk anak-anak
                validWords: ['a', 'ei', 'ay', 'hey', 'eight', 'eh', 'day', 'say', 'yeah', 'okay']
            }
        };

        let currentLang = 'id';
        const langBtn = document.getElementById('langBtn');

        function applyLanguage() {
            const t = i18n[currentLang];
            document.getElementById('txt-step1').innerText = t.step1;
            document.getElementById('txt-desc1').innerText = t.desc1;
            document.getElementById('txt-step2').innerText = t.step2;
            document.getElementById('txt-desc2').innerText = t.desc2;
            document.getElementById('playSoundBtn').innerText = t.listen;
            document.getElementById('speakBtn').innerText = t.speak;
            document.getElementById('txt-step3').innerText = t.step3;
            document.getElementById('txt-desc3').innerText = t.desc3;
            document.getElementById('retryBtn').innerText = t.retry;
            document.getElementById('voiceFeedback').innerText = "";
            langBtn.innerText = currentLang === 'id' ? 'ID 🇮🇩' : 'EN 🇬🇧';
        }

        langBtn.addEventListener('click', () => {
            currentLang = currentLang === 'id' ? 'en' : 'id';
            applyLanguage();
        });


        // --- SISTEM AUDIO (SORAKAN ANAK & EFEK GAGAL) ---
        const audioCheer = document.getElementById('audioCheer');
        const audioFail = document.getElementById('audioFail');
        let mediaUnlocked = false;

        // Buka blokir audio Safari di sentuhan pertama
        function unlockMedia() {
            if (!mediaUnlocked) {
                const unlockMsg = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(unlockMsg);
                
                // Mainkan dan pause seketika untuk mendapatkan izin dari iOS
                audioCheer.play().then(() => audioCheer.pause()).catch(e => {});
                audioFail.play().then(() => audioFail.pause()).catch(e => {});
                mediaUnlocked = true;
            }
        }

        window.addEventListener('touchstart', unlockMedia, { passive: true, once: true });
        window.addEventListener('mousedown', unlockMedia, { passive: true, once: true });

        function playSuccessSFX() {
            audioCheer.currentTime = 0;
            audioCheer.play().catch(e => console.log("Audio play blocked:", e));
            
            // Efek Pinata Confetti
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 },
                colors: ['#00BBF9', '#00F5D4', '#F15BB5', '#FEE440'],
                zIndex: 9999
            });
        }

        function playFailSFX() {
            audioFail.currentTime = 0;
            audioFail.play().catch(e => console.log("Audio play blocked:", e));
        }

        function playLetterSound() {
            const t = i18n[currentLang];
            const msg = new SpeechSynthesisUtterance(t.ttsLetter);
            msg.lang = t.langCode;
            msg.rate = 0.8; // Diperlambat sedikit agar jelas
            window.speechSynthesis.speak(msg);
        }


        // --- MANAJEMEN TAMPILAN (STEPS) ---
        const step1 = document.getElementById('step1-tracing');
        const step2 = document.getElementById('step2-voice');
        const step3 = document.getElementById('step3-ar');

        function goToStep(stepNum) {
            step1.style.display = 'none';
            step2.style.display = 'none';
            step3.style.display = 'none';
            if(stepNum === 1) step1.style.display = 'flex';
            if(stepNum === 2) step2.style.display = 'flex';
            if(stepNum === 3) step3.style.display = 'flex';
        }


        // --- LOGIKA TRACING ---
        const canvas = document.getElementById('tracingCanvas');
        const ctx = canvas.getContext('2d');
        
        let isDrawing = false;
        let isTracingComplete = false;
        let strokes = []; 
        let currentStroke = []; 

        let checkpoints = [
            { x: 175, y: 65, hit: false },   
            { x: 115, y: 235, hit: false },  
            { x: 175, y: 235, hit: false },  
            { x: 235, y: 235, hit: false },  
            { x: 65, y: 345, hit: false },   
            { x: 285, y: 345, hit: false }   
        ];

        function resetCanvas() {
            checkpoints.forEach(pt => pt.hit = false);
            strokes = [];
            currentStroke = [];
            isTracingComplete = false;
            redrawAll();
        }

        function redrawAll() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            checkpoints.forEach(pt => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 14, 0, Math.PI * 2);
                ctx.fillStyle = pt.hit ? '#FF9F1C' : '#FFD166'; 
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#2B2D42';
                ctx.stroke();
            });

            ctx.lineWidth = 22; 
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = 'rgba(155, 93, 229, 0.8)';

            strokes.forEach(stroke => {
                if (stroke.length === 0) return;
                ctx.beginPath();
                ctx.moveTo(stroke[0].x, stroke[0].y);
                for (let i = 1; i < stroke.length; i++) {
                    ctx.lineTo(stroke[i].x, stroke[i].y);
                }
                ctx.stroke();
            });

            if (isDrawing && currentStroke.length > 0) {
                ctx.beginPath();
                ctx.moveTo(currentStroke[0].x, currentStroke[0].y);
                for (let i = 1; i < currentStroke.length; i++) {
                    ctx.lineTo(currentStroke[i].x, currentStroke[i].y);
                }
                ctx.stroke();
            }
        }

        redrawAll();

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function startDrawing(e) {
            if (isTracingComplete) return;
            e.preventDefault(); 
            isDrawing = true;
            const pos = getCoordinates(e);
            currentStroke = [pos];
            redrawAll();
        }

        function stopDrawing(e) {
            if (e) e.preventDefault();
            if (isDrawing) {
                strokes.push(currentStroke);
                isDrawing = false;
                currentStroke = [];
            }
        }

        function draw(e) {
            if (!isDrawing || isTracingComplete) return;
            e.preventDefault();
            const pos = getCoordinates(e);
            currentStroke.push(pos);
            checkHit(pos.x, pos.y);
            redrawAll(); 
        }

        function checkHit(x, y) {
            let hitOccurred = false;
            checkpoints.forEach(pt => {
                const dist = Math.hypot(pt.x - x, pt.y - y);
                if (dist < 30 && !pt.hit) {
                    pt.hit = true;
                    hitOccurred = true;
                }
            });

            if (hitOccurred) {
                const allHit = checkpoints.every(pt => pt.hit === true);
                if (allHit) {
                    isTracingComplete = true; 
                    stopDrawing(); 
                    
                    playSuccessSFX(); 
                    setTimeout(() => { goToStep(2); }, 2500); 
                }
            }
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', startDrawing, {passive: false});
        canvas.addEventListener('touchend', stopDrawing, {passive: false});
        canvas.addEventListener('touchmove', draw, {passive: false});


        // --- LOGIKA SUARA (STEP 2) ---
        const speakBtn = document.getElementById('speakBtn');
        const playSoundBtn = document.getElementById('playSoundBtn');
        const voiceFeedback = document.getElementById('voiceFeedback');

        playSoundBtn.addEventListener('click', playLetterSound);

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.interimResults = false;

            const resetBtnState = () => {
                speakBtn.classList.remove('recording');
                speakBtn.innerText = i18n[currentLang].speak;
            };

            speakBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (speakBtn.classList.contains('recording')) return;

                unlockMedia(); // Pastikan media siap sebelum mic menyala
                const t = i18n[currentLang];
                recognition.lang = t.langCode;
                
                try {
                    recognition.start();
                } catch (err) {}
                
                speakBtn.classList.add('recording');
                speakBtn.innerText = t.listening;
                voiceFeedback.innerText = "";
            });

            recognition.onresult = (event) => {
                resetBtnState();
                const t = i18n[currentLang];
                const transcript = event.results[0][0].transcript.toLowerCase().trim();
                
                const isCorrect = t.validWords.some(word => transcript.includes(word));

                if (isCorrect) {
                    voiceFeedback.innerText = t.success;
                    voiceFeedback.style.color = "#00BBF9"; 
                    playSuccessSFX(); 
                    setTimeout(() => { goToStep(3); }, 2500);
                } else {
                    voiceFeedback.innerText = t.failText + `"${transcript}".` + t.failTryAgain;
                    voiceFeedback.style.color = "#F15BB5";
                    playFailSFX(); 
                }
            };
            
            recognition.onspeechend = () => {
                recognition.stop();
                resetBtnState();
            };

            recognition.onerror = (event) => {
                resetBtnState();
                const t = i18n[currentLang];
                
                // Bypass bug iOS: Jika baru pertama minta izin (not-allowed / aborted)
                if (event.error === 'not-allowed' || event.error === 'aborted') {
                    voiceFeedback.innerText = t.micError;
                    voiceFeedback.style.color = "#FF9F1C"; // Warna oranye peringatan
                    return; // Hentikan fungsi agar tidak putar suara gagal
                }

                voiceFeedback.innerText = t.error;
                voiceFeedback.style.color = "#F15BB5";
                playFailSFX();
            };

        } else {
            speakBtn.style.display = 'none';
            voiceFeedback.innerText = "Browser tidak mendukung rekam suara";
        }


        // --- LOGIKA ULANGI (STEP 3) ---
        const retryBtn = document.getElementById('retryBtn');
        retryBtn.addEventListener('click', () => {
            resetCanvas();
            voiceFeedback.innerText = "";
            goToStep(1);
        });

    </script>
</body>
</html>
