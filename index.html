<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tracing Dots to AR</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            /* Mencegah scroll di level body */
            overflow: hidden;
            touch-action: none; 
        }

        #card-container, #ar-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 95%;
        }

        #ar-container {
            display: none;
            width: 400px;
            max-width: 100%;
        }

        canvas {
            border: 2px solid #ccc;
            border-radius: 10px;
            /* Mencegah default touch action browser di area kanvas */
            touch-action: none; 
            cursor: crosshair;
            background-color: #f0f0f0; 
            background-image: url('letter_a_trace.png'); 
            background-size: 100% 100%; 
            background-position: center;
            background-repeat: no-repeat;
        }

        model-viewer {
            width: 100%;
            height: 350px;
            background-color: #eee;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        h2 { color: #333; margin-bottom: 5px; }
        p { color: #666; margin-bottom: 20px; font-size: 14px; }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,123,255,0.3);
            transition: transform 0.2s, background-color 0.2s;
            flex: 1;
        }

        .btn:active { transform: scale(0.95); }
        .btn.recording { background-color: #FF3B30; box-shadow: 0 5px 15px rgba(255,59,48,0.3); }
        .btn-sound { background-color: #28a745; box-shadow: 0 5px 15px rgba(40,167,69,0.3); }

    </style>
</head>
<body>

    <div id="card-container">
        <h2>Langkah 1: Hubungkan Titik</h2>
        <p>Tarik garis (drag) mengikuti garis putus-putus.</p>
        <canvas id="tracingCanvas" width="350" height="400"></canvas>
    </div>

    <div id="ar-container">
        <h2>Langkah 2: AR & Suara</h2>
        
        <model-viewer 
            src="letter_A.glb" 
            alt="Model 3D Huruf A" 
            auto-rotate 
            camera-controls 
            ar 
            ar-modes="webxr scene-viewer quick-look">
        </model-viewer>

        <div class="btn-group">
            <button class="btn btn-sound" id="playSoundBtn">🔊 Dengar</button>
            <button class="btn" id="speakBtn">🎤 Ucapkan "A"</button>
        </div>
        <p id="voiceFeedback" style="margin-top: 15px; font-weight: bold; color: #28a745;"></p>
    </div>

    <script>
        // Unlock Audio untuk Safari iOS
        let audioUnlocked = false;
        function unlockAudio() {
            if (!audioUnlocked) {
                const unlockMsg = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(unlockMsg);
                audioUnlocked = true;
            }
        }
        document.body.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
        document.body.addEventListener('click', unlockAudio, { once: true });

        const canvas = document.getElementById('tracingCanvas');
        const ctx = canvas.getContext('2d');
        const cardContainer = document.getElementById('card-container');
        const arContainer = document.getElementById('ar-container');

        let isDrawing = false;

        let checkpoints = [
            { x: 175, y: 50, hit: false },   
            { x: 110, y: 220, hit: false },  
            { x: 60, y: 350, hit: false },   
            { x: 240, y: 220, hit: false },  
            { x: 290, y: 350, hit: false },  
            { x: 175, y: 240, hit: false }   
        ];

        function drawCheckpoints() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            checkpoints.forEach(pt => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 12, 0, Math.PI * 2);
                ctx.fillStyle = pt.hit ? 'rgba(40,167,69,0.8)' : 'rgba(150,150,150,0.5)'; 
                ctx.fill();
            });
        }

        drawCheckpoints();

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            return { 
                x: (clientX - rect.left) * scaleX, 
                y: (clientY - rect.top) * scaleY 
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getCoordinates(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function draw(e) {
            if (!isDrawing) return;
            
            const pos = getCoordinates(e);

            ctx.lineWidth = 18; 
            ctx.lineCap = 'round';
            ctx.strokeStyle = 'rgba(0, 123, 255, 0.6)'; 
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            
            checkHit(pos.x, pos.y);
        }

        function checkHit(x, y) {
            let hitOccurred = false;
            checkpoints.forEach(pt => {
                const dist = Math.hypot(pt.x - x, pt.y - y);
                if (dist < 30 && !pt.hit) { 
                    pt.hit = true;
                    hitOccurred = true;
                }
            });

            if (hitOccurred) {
                checkCompletion();
            }
        }

        function playLetterSound() {
            const msg = new SpeechSynthesisUtterance("ah.");
            msg.lang = 'id-ID';
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }

        function checkCompletion() {
            const allHit = checkpoints.every(pt => pt.hit === true);
            if (allHit) {
                isDrawing = false; 
                drawCheckpoints(); 
                
                setTimeout(() => {
                    cardContainer.style.display = 'none';
                    arContainer.style.display = 'flex';
                    playLetterSound();
                }, 600); 
            }
        }

        // EVENT LISTENER MOUSE (Untuk di Komputer)
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mousemove', draw);

        // EVENT LISTENER TOUCH (Untuk di iPad/HP) - Diberi passive: false dan preventDefault
        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault(); // Paksa browser untuk tidak scroll
            startDrawing(e);
        }, { passive: false });

        canvas.addEventListener('touchend', function(e) {
            e.preventDefault();
            stopDrawing();
        }, { passive: false });

        canvas.addEventListener('touchmove', function(e) {
            e.preventDefault(); // Paksa browser untuk tidak scroll
            draw(e);
        }, { passive: false });


        // --- LOGIKA SUARA ---
        const speakBtn = document.getElementById('speakBtn');
        const playSoundBtn = document.getElementById('playSoundBtn');
        const voiceFeedback = document.getElementById('voiceFeedback');

        playSoundBtn.addEventListener('click', playLetterSound);

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'id-ID';
            recognition.interimResults = false;

            const startRec = (e) => {
                e.preventDefault();
                recognition.start();
                speakBtn.classList.add('recording');
                speakBtn.innerText = "Mendengarkan...";
                voiceFeedback.innerText = "";
            };

            const stopRec = (e) => {
                e.preventDefault();
                recognition.stop();
                speakBtn.classList.remove('recording');
                speakBtn.innerText = "🎤 Ucapkan \"A\"";
            };

            // Tambahan passive false juga untuk tombol mic
            speakBtn.addEventListener('mousedown', startRec);
            speakBtn.addEventListener('mouseup', stopRec);
            speakBtn.addEventListener('touchstart', startRec, { passive: false });
            speakBtn.addEventListener('touchend', stopRec, { passive: false });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.toLowerCase().trim();
                
                const validWords = ['a', 'ah', 'ha', 'aa', 'eh'];
                const isCorrect = validWords.some(word => transcript.includes(word));

                if (isCorrect) {
                    voiceFeedback.innerText = "Pintar! Itu huruf A.";
                    voiceFeedback.style.color = "#28a745";
                    
                    const reply = new SpeechSynthesisUtterance("Pintar!");
                    reply.lang = 'id-ID';
                    window.speechSynthesis.speak(reply);
                } else {
                    voiceFeedback.innerText = `Kamu bilang: "${transcript}". Coba lagi bilang "A".`;
                    voiceFeedback.style.color = "#FF3B30";
                }
            };
            
            recognition.onerror = (event) => {
                voiceFeedback.innerText = "Suara tidak terdengar jelas, coba lagi.";
                voiceFeedback.style.color = "#FF3B30";
            };
        } else {
            speakBtn.style.display = 'none';
            voiceFeedback.innerText = "Browser kamu tidak mendukung rekam suara.";
        }
    </script>
</body>
</html>
