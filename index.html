<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tracing Dots to AR</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #FEE440; /* Kuning ceria */
            background-image: radial-gradient(circle, #FFF07C 20%, transparent 20%), radial-gradient(circle, #FFF07C 20%, transparent 20%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: #2B2D42;
        }

        /* Desain Kartu Bergaya Kartun */
        #card-container, #ar-container {
            background: #FFFFFF;
            border: 5px solid #2B2D42;
            border-radius: 30px;
            box-shadow: 0 12px 0 #2B2D42; /* Bayangan tebal ala kartun */
            padding: 30px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 95%;
            box-sizing: border-box;
        }

        #ar-container {
            display: none;
            width: 400px;
            max-width: 100%;
        }

        canvas {
            border: 4px dashed #00BBF9;
            border-radius: 20px;
            touch-action: none; 
            cursor: crosshair;
            background-color: #F8F9FA; 
            background-image: url('letter_a_trace.png'); 
            background-size: 100% 100%; 
            background-position: center;
            background-repeat: no-repeat;
            margin-top: 10px;
        }

        model-viewer {
            width: 100%;
            height: 300px;
            background-color: #E5E5EA;
            border: 4px solid #2B2D42;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        h2 { 
            margin: 0 0 10px 0; 
            font-size: 28px; 
            font-weight: 700;
            color: #F15BB5; /* Pink cerah */
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p { 
            margin: 0 0 15px 0; 
            font-size: 16px; 
            font-weight: 500;
            color: #6C757D; 
        }

        .btn-group {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-bottom: 12px;
        }

        /* Desain Tombol Ceria */
        .btn {
            font-family: 'Fredoka', sans-serif;
            color: white;
            border: 4px solid #2B2D42;
            padding: 14px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 0 #2B2D42;
            transition: all 0.1s;
            flex: 1;
            text-transform: uppercase;
        }

        .btn:active { 
            transform: translateY(6px); 
            box-shadow: 0 0 0 #2B2D42; 
        }

        /* Variasi Warna Tombol */
        .btn-sound { background-color: #00BBF9; } /* Biru */
        .btn-speak { background-color: #00F5D4; color: #2B2D42; } /* Hijau Mint */
        .btn-retry { background-color: #F15BB5; width: 100%; } /* Pink */
        .btn-speak.recording { background-color: #FF3366; color: white; }

        #voiceFeedback {
            margin-top: 10px;
            font-size: 16px;
            font-weight: 600;
            min-height: 20px;
        }

    </style>
</head>
<body>

    <div id="card-container">
        <h2>Langkah 1</h2>
        <p>Tarik garis mengikuti titik-titik putus</p>
        <canvas id="tracingCanvas" width="350" height="400"></canvas>
    </div>

    <div id="ar-container">
        <h2>Kerja Bagus!</h2>
        
        <model-viewer 
            src="letter_A.glb" 
            alt="Model 3D Huruf A" 
            auto-rotate 
            camera-controls 
            ar 
            ar-modes="webxr scene-viewer quick-look">
        </model-viewer>

        <div class="btn-group">
            <button class="btn btn-sound" id="playSoundBtn">Dengar</button>
            <button class="btn btn-speak" id="speakBtn">Ucapkan A</button>
        </div>
        <button class="btn btn-retry" id="retryBtn">Ulangi Menggambar</button>
        
        <div id="voiceFeedback"></div>
    </div>

    <script>
        // Unlock Audio untuk Safari iOS
        let audioUnlocked = false;
        function unlockAudio() {
            if (!audioUnlocked) {
                const unlockMsg = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(unlockMsg);
                audioUnlocked = true;
            }
        }
        document.body.addEventListener('touchstart', unlockAudio, { once: true });
        document.body.addEventListener('click', unlockAudio, { once: true });

        const canvas = document.getElementById('tracingCanvas');
        const ctx = canvas.getContext('2d');
        const cardContainer = document.getElementById('card-container');
        const arContainer = document.getElementById('ar-container');
        const voiceFeedback = document.getElementById('voiceFeedback');

        let isDrawing = false;

        let checkpoints = [
            { x: 175, y: 50, hit: false },   
            { x: 110, y: 220, hit: false },  
            { x: 60, y: 350, hit: false },   
            { x: 240, y: 220, hit: false },  
            { x: 290, y: 350, hit: false },  
            { x: 175, y: 240, hit: false }   
        ];

        function drawCheckpoints() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            checkpoints.forEach(pt => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 14, 0, Math.PI * 2);
                // Warna kuning tebal untuk titik yang belum kena, oranye jika sudah kena
                ctx.fillStyle = pt.hit ? '#FF9F1C' : '#FFD166'; 
                ctx.fill();
                // Tambahkan border pada titik biar lebih kartun
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#2B2D42';
                ctx.stroke();
            });
        }

        drawCheckpoints();

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            return { 
                x: (clientX - rect.left) * scaleX, 
                y: (clientY - rect.top) * scaleY 
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getCoordinates(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            
            const pos = getCoordinates(e);

            ctx.lineWidth = 22; // Coretan dibuat lebih tebal ala spidol anak-anak
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = 'rgba(155, 93, 229, 0.8)'; // Warna spidol ungu ceria
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            
            checkHit(pos.x, pos.y);
        }

        function checkHit(x, y) {
            let hitOccurred = false;
            checkpoints.forEach(pt => {
                const dist = Math.hypot(pt.x - x, pt.y - y);
                if (dist < 30 && !pt.hit) {
                    pt.hit = true;
                    hitOccurred = true;
                }
            });

            if (hitOccurred) {
                checkCompletion();
            }
        }

        function playLetterSound() {
            const msg = new SpeechSynthesisUtterance("ah.");
            msg.lang = 'id-ID';
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }

        function checkCompletion() {
            const allHit = checkpoints.every(pt => pt.hit === true);
            if (allHit) {
                isDrawing = false; 
                drawCheckpoints(); 
                
                setTimeout(() => {
                    cardContainer.style.display = 'none';
                    arContainer.style.display = 'flex';
                    playLetterSound();
                }, 600); 
            }
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchmove', draw);


        // --- LOGIKA TOMBOL KEMBALI (RETRY) ---
        const retryBtn = document.getElementById('retryBtn');
        retryBtn.addEventListener('click', () => {
            // Reset status semua titik
            checkpoints.forEach(pt => pt.hit = false);
            // Bersihkan kanvas dan gambar ulang titik awal
            drawCheckpoints();
            // Kembalikan teks feedback jadi kosong
            voiceFeedback.innerText = "";
            // Ganti tampilan ke langkah 1
            arContainer.style.display = 'none';
            cardContainer.style.display = 'flex';
        });


        // --- LOGIKA SUARA ---
        const speakBtn = document.getElementById('speakBtn');
        const playSoundBtn = document.getElementById('playSoundBtn');

        playSoundBtn.addEventListener('click', playLetterSound);

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'id-ID';
            recognition.interimResults = false;

            const startRec = (e) => {
                e.preventDefault();
                recognition.start();
                speakBtn.classList.add('recording');
                speakBtn.innerText = "Mendengarkan...";
                voiceFeedback.innerText = "";
            };

            const stopRec = (e) => {
                e.preventDefault();
                recognition.stop();
                speakBtn.classList.remove('recording');
                speakBtn.innerText = "Ucapkan A";
            };

            speakBtn.addEventListener('mousedown', startRec);
            speakBtn.addEventListener('mouseup', stopRec);
            speakBtn.addEventListener('touchstart', startRec);
            speakBtn.addEventListener('touchend', stopRec);

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.toLowerCase().trim();
                
                const validWords = ['a', 'ah', 'ha', 'aa', 'eh'];
                const isCorrect = validWords.some(word => transcript.includes(word));

                if (isCorrect) {
                    voiceFeedback.innerText = "Hebat! Itu huruf A";
                    voiceFeedback.style.color = "#00BBF9"; // Biru ceria
                    
                    const reply = new SpeechSynthesisUtterance("Hebat!");
                    reply.lang = 'id-ID';
                    window.speechSynthesis.speak(reply);
                } else {
                    voiceFeedback.innerText = `Kamu bilang: "${transcript}". Coba lagi ya`;
                    voiceFeedback.style.color = "#F15BB5"; // Pink terang
                }
            };
            
            recognition.onerror = (event) => {
                voiceFeedback.innerText = "Suaranya kurang jelas, coba lagi ya";
                voiceFeedback.style.color = "#F15BB5";
            };
        } else {
            speakBtn.style.display = 'none';
            voiceFeedback.innerText = "Browser tidak mendukung rekam suara";
        }
    </script>
</body>
</html>
