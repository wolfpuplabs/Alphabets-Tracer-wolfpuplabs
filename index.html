<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Alphabet Tracer IDN / ENG - By Wolfpuplabs</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Gluten:wght@400;600;700;800;900&family=Mali:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --bg-color: #E2F3F5;
            --card-bg: rgba(255, 255, 255, 0.92);
            --primary-pink: #FF5376;
            --primary-cyan: #00E5FF;
            --primary-yellow: #FFD200;
            --primary-purple: #7C4DFF;
            --text-color: #1A1C2E;
            --stroke-color: #12131C;
            --font-title: 'Gluten', cursive;
            --font-body: 'Mali', cursive;
        }

        body {
            font-family: var(--font-body);
            background-color: #B3E5FC;
            background-image: 
                radial-gradient(circle at 10% 20%, #FFF59D 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, #FF80AB 0%, transparent 25%),
                radial-gradient(circle at 50% 50%, #B388FF 0%, transparent 45%);
            background-attachment: fixed;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
            color: var(--text-color);
        }

        /* Language Toggle Button 3D tanpa Emoji */
        .lang-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #FFFFFF;
            border: 3px solid var(--stroke-color);
            border-radius: 18px;
            padding: 6px 14px;
            font-family: var(--font-title);
            font-weight: 800;
            font-size: 15px;
            color: var(--stroke-color);
            cursor: pointer;
            box-shadow: 0 4px 0 var(--stroke-color);
            transition: all 0.1s ease;
            z-index: 100;
        }
        .lang-toggle:active { transform: translateY(4px); box-shadow: 0 0 0 var(--stroke-color); }

        /* Card Container Spatial 3D */
        .card-container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 4px solid #FFFFFF;
            outline: 4px solid var(--stroke-color);
            border-radius: 36px;
            box-shadow: 0 16px 0 var(--stroke-color), 0 25px 30px rgba(0, 0, 0, 0.12); 
            padding: 20px 20px 24px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 90%;
            width: 360px; 
            box-sizing: border-box;
            position: relative;
        }

        #step2-voice, #step3-ar {
            display: none;
        }

        /* Header App Branding */
        .app-header {
            margin-bottom: 12px;
        }

        .app-title {
            font-family: var(--font-title);
            font-size: 24px;
            font-weight: 900;
            color: var(--primary-purple);
            margin: 0;
            text-shadow: 2px 2px 0 var(--stroke-color);
            -webkit-text-stroke: 1px var(--stroke-color);
            line-height: 1.1;
        }

        .app-subtitle {
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-pink);
            margin: 2px 0 0 0;
            letter-spacing: 0.5px;
        }

        /* Canvas Tracing */
        #tracingCanvas {
            border: 4px dashed var(--primary-purple);
            border-radius: 24px;
            touch-action: none; 
            cursor: crosshair;
            background-color: #FFFFFF; 
            background-image: url('letter_a_trace.png'); 
            background-size: 100% 100%; 
            background-position: center;
            background-repeat: no-repeat;
            margin-top: 6px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.05);
            max-width: 100%;
        }

        model-viewer {
            width: 100%;
            height: 220px;
            background: radial-gradient(circle, #FFFFFF 0%, #E1F5FE 100%);
            border: 4px solid var(--stroke-color);
            border-radius: 24px;
            margin-bottom: 16px;
        }

        h2 { 
            font-family: var(--font-title);
            margin: 0 0 2px 0; 
            font-size: 26px; 
            font-weight: 800;
            color: var(--primary-pink); 
            text-shadow: 2px 2px 0 var(--stroke-color);
            -webkit-text-stroke: 1px var(--stroke-color);
            letter-spacing: 0.5px;
        }

        p { 
            margin: 0 0 10px 0; 
            font-size: 14px; 
            font-weight: 600;
            color: #455A64; 
        }

        /* Huruf 3D Bouncy Floating */
        .big-letter {
            font-family: var(--font-title);
            font-size: 80px; 
            font-weight: 900; 
            color: var(--primary-yellow); 
            margin: 0 0 6px 0;
            line-height: 1;
            text-shadow: 
                3.5px 3.5px 0 var(--stroke-color),
                -1.5px -1.5px 0 var(--stroke-color),
                1.5px -1.5px 0 var(--stroke-color),
                -1.5px 1.5px 0 var(--stroke-color);
            animation: float 2.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 8px;
        }

        .btn {
            font-family: var(--font-title);
            color: white;
            border: 3.5px solid var(--stroke-color);
            padding: 12px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--stroke-color);
            transition: all 0.1s ease;
            flex: 1;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active { 
            transform: translateY(5px); 
            box-shadow: 0 0 0 var(--stroke-color); 
        }

        .btn-sound { background-color: var(--primary-cyan); color: #004D40; } 
        .btn-speak { background-color: var(--primary-yellow); color: #3E2723; } 
        .btn-retry { background-color: var(--primary-pink); width: 100%; } 
        
        .btn-speak.recording { 
            background-color: #FF1744; 
            color: white; 
            box-shadow: 0 0 0 var(--stroke-color);
            transform: translateY(5px);
            animation: pulseGlow 1s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0px rgba(255, 23, 68, 0.6); }
            100% { box-shadow: 0 0 0 12px rgba(255, 23, 68, 0); }
        }

        #voiceFeedback {
            margin-top: 6px;
            font-size: 14px;
            font-weight: 700;
            min-height: 22px;
            padding: 4px 8px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <button id="langBtn" class="lang-toggle">IDN</button>

    <div id="step1-tracing" class="card-container">
        <div class="app-header">
            <h1 class="app-title">Alphabet Tracer IDN / ENG</h1>
            <p class="app-subtitle">By Wolfpuplabs</p>
        </div>
        <h2 id="txt-step1">Langkah 1</h2>
        <p id="txt-desc1">Hubungkan semua titik pada huruf A</p>
        <canvas id="tracingCanvas" width="320" height="340"></canvas>
    </div>

    <div id="step2-voice" class="card-container">
        <div class="app-header">
            <h1 class="app-title">Alphabet Tracer IDN / ENG</h1>
            <p class="app-subtitle">By Wolfpuplabs</p>
        </div>
        <h2 id="txt-step2">Langkah 2</h2>
        <p id="txt-desc2">Dengarkan lalu ucapkan hurufnya!</p>
        <div class="big-letter">Aa</div>
        <div class="btn-group">
            <button class="btn btn-sound" id="playSoundBtn">Dengar</button>
            <button class="btn btn-speak" id="speakBtn">Ucapkan</button>
        </div>
        <div id="voiceFeedback"></div>
    </div>

    <div id="step3-ar" class="card-container">
        <div class="app-header">
            <h1 class="app-title">Alphabet Tracer IDN / ENG</h1>
            <p class="app-subtitle">By Wolfpuplabs</p>
        </div>
        <h2 id="txt-step3">Luar Biasa!</h2>
        <p id="txt-desc3">Lihat huruf A secara AR di sekitarmu!</p>
        
        <model-viewer 
            src="letter_A.glb" 
            alt="Model 3D Huruf A" 
            auto-rotate 
            camera-controls 
            ar 
            ar-modes="webxr scene-viewer quick-look">
        </model-viewer>

        <button class="btn btn-retry" id="retryBtn">Ulangi dari Awal</button>
    </div>

    <script>
        // --- MULTI-LANGUAGE DICTIONARY (NO EMOJIS) ---
        const i18n = {
            id: {
                step1: "Langkah 1", desc1: "Hubungkan semua titik pada huruf A",
                step2: "Langkah 2", desc2: "Dengarkan lalu ucapkan hurufnya!",
                listen: "Dengar", speak: "Ucapkan",
                step3: "Luar Biasa!", desc3: "Lihat huruf A secara AR di sekitarmu!",
                retry: "Ulangi dari Awal",
                listening: "Mendengarkan...", success: "Hebat! Suaramu Mantap!",
                failText: "Kamu bilang: ", failTryAgain: " Coba lagi ya!",
                error: "Suara kurang jelas, coba lagi ya!",
                ttsLetter: "a", langCode: "id-ID"
            },
            en: {
                step1: "Step 1", desc1: "Connect all the dots on the letter A",
                step2: "Step 2", desc2: "Listen and then say the letter!",
                listen: "Listen", speak: "Say It",
                step3: "Awesome!", desc3: "View the letter A in AR around you!",
                retry: "Start Over",
                listening: "Listening...", success: "Awesome! Great job!",
                failText: "You said: ", failTryAgain: " Try again!",
                error: "Didn't catch that, try again!",
                ttsLetter: "a", langCode: "en-US"
            }
        };

        let currentLang = 'id';
        const langBtn = document.getElementById('langBtn');

        function applyLanguage() {
            const t = i18n[currentLang];
            document.querySelectorAll('#txt-step1').forEach(el => el.innerText = t.step1);
            document.getElementById('txt-desc1').innerText = t.desc1;
            document.querySelectorAll('#txt-step2').forEach(el => el.innerText = t.step2);
            document.getElementById('txt-desc2').innerText = t.desc2;
            document.getElementById('playSoundBtn').innerText = t.listen;
            document.getElementById('speakBtn').innerText = t.speak;
            document.querySelectorAll('#txt-step3').forEach(el => el.innerText = t.step3);
            document.getElementById('txt-desc3').innerText = t.desc3;
            document.getElementById('retryBtn').innerText = t.retry;
            document.getElementById('voiceFeedback').innerText = "";
            langBtn.innerText = currentLang === 'id' ? 'IDN' : 'ENG';
        }

        langBtn.addEventListener('click', () => {
            currentLang = currentLang === 'id' ? 'en' : 'id';
            applyLanguage();
        });

        // --- EFEK AUDIO (SYNTHESIZED WEB AUDIO API) ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSuccessSFX() {
            initAudio();
            const now = audioCtx.currentTime;
            const notes = [261.63, 329.63, 392.00, 523.25]; 
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + i * 0.1);
                gain.gain.setValueAtTime(0.3, now + i * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + i * 0.1);
                osc.stop(now + i * 0.1 + 0.4);
            });
        }

        function playFailSFX() {
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.3);
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#00E5FF', '#FFD200', '#FF5376', '#7C4DFF'],
                    zIndex: 9999
                });
            }
        }

        function playLetterSound() {
            initAudio();
            const t = i18n[currentLang];
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t.ttsLetter);
            msg.lang = t.langCode;
            msg.rate = 0.8;
            window.speechSynthesis.speak(msg);
        }

        window.addEventListener('touchstart', initAudio, { passive: true, once: true });
        window.addEventListener('mousedown', initAudio, { passive: true, once: true });

        // --- STEP NAVIGATION ---
        const step1 = document.getElementById('step1-tracing');
        const step2 = document.getElementById('step2-voice');
        const step3 = document.getElementById('step3-ar');

        function goToStep(stepNum) {
            step1.style.display = 'none';
            step2.style.display = 'none';
            step3.style.display = 'none';
            if(stepNum === 1) step1.style.display = 'flex';
            if(stepNum === 2) step2.style.display = 'flex';
            if(stepNum === 3) step3.style.display = 'flex';
        }

        // --- TRACING LOGIC (STEP 1) ---
        const canvas = document.getElementById('tracingCanvas');
        const ctx = canvas.getContext('2d');
        
        let isDrawing = false;
        let isTracingComplete = false;
        let strokes = []; 
        let currentStroke = []; 

        let checkpoints = [
            { x: 160, y: 50, hit: false },   
            { x: 100, y: 200, hit: false },  
            { x: 160, y: 200, hit: false },  
            { x: 220, y: 200, hit: false },  
            { x: 55, y: 300, hit: false },   
            { x: 265, y: 300, hit: false }   
        ];

        function resetCanvas() {
            checkpoints.forEach(pt => pt.hit = false);
            strokes = [];
            currentStroke = [];
            isTracingComplete = false;
            redrawAll();
        }

        function redrawAll() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            checkpoints.forEach(pt => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 13, 0, Math.PI * 2);
                ctx.fillStyle = pt.hit ? '#FFD200' : '#E1F5FE'; 
                ctx.fill();
                ctx.lineWidth = 3.5;
                ctx.strokeStyle = '#12131C';
                ctx.stroke();
            });

            ctx.lineWidth = 18; 
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#7C4DFF';

            strokes.forEach(stroke => {
                if (stroke.length === 0) return;
                ctx.beginPath();
                ctx.moveTo(stroke[0].x, stroke[0].y);
                for (let i = 1; i < stroke.length; i++) {
                    ctx.lineTo(stroke[i].x, stroke[i].y);
                }
                ctx.stroke();
            });

            if (isDrawing && currentStroke.length > 0) {
                ctx.beginPath();
                ctx.moveTo(currentStroke[0].x, currentStroke[0].y);
                for (let i = 1; i < currentStroke.length; i++) {
                    ctx.lineTo(currentStroke[i].x, currentStroke[i].y);
                }
                ctx.stroke();
            }
        }

        redrawAll();

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function startDrawing(e) {
            if (isTracingComplete) return;
            e.preventDefault(); 
            initAudio();
            isDrawing = true;
            const pos = getCoordinates(e);
            currentStroke = [pos];
            redrawAll();
        }

        function stopDrawing(e) {
            if (e) e.preventDefault();
            if (isDrawing) {
                strokes.push(currentStroke);
                isDrawing = false;
                currentStroke = [];
            }
        }

        function draw(e) {
            if (!isDrawing || isTracingComplete) return;
            e.preventDefault();
            const pos = getCoordinates(e);
            currentStroke.push(pos);
            checkHit(pos.x, pos.y);
            redrawAll(); 
        }

        function checkHit(x, y) {
            let hitOccurred = false;
            checkpoints.forEach(pt => {
                const dist = Math.hypot(pt.x - x, pt.y - y);
                if (dist < 30 && !pt.hit) {
                    pt.hit = true;
                    hitOccurred = true;
                }
            });

            if (hitOccurred) {
                const allHit = checkpoints.every(pt => pt.hit === true);
                if (allHit) {
                    isTracingComplete = true; 
                    stopDrawing(); 
                    
                    playSuccessSFX(); 
                    triggerConfetti();
                    setTimeout(() => { goToStep(2); }, 1800); 
                }
            }
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', startDrawing, {passive: false});
        canvas.addEventListener('touchend', stopDrawing, {passive: false});
        canvas.addEventListener('touchmove', draw, {passive: false});

        // --- VOICE RECOGNITION (STEP 2) ---
        const speakBtn = document.getElementById('speakBtn');
        const playSoundBtn = document.getElementById('playSoundBtn');
        const voiceFeedback = document.getElementById('voiceFeedback');

        playSoundBtn.addEventListener('click', playLetterSound);

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            let isRecording = false;

            const resetBtnState = () => {
                isRecording = false;
                speakBtn.classList.remove('recording');
                speakBtn.innerText = i18n[currentLang].speak;
            };

            speakBtn.addEventListener('click', (e) => {
                e.preventDefault();
                initAudio();

                if (isRecording) {
                    recognition.stop();
                    resetBtnState();
                    return;
                }

                const t = i18n[currentLang];
                recognition.lang = t.langCode;
                
                try {
                    recognition.start();
                    isRecording = true;
                    speakBtn.classList.add('recording');
                    speakBtn.innerText = t.listening;
                    voiceFeedback.innerText = "";
                    voiceFeedback.style.backgroundColor = "transparent";
                } catch (err) {
                    resetBtnState();
                }
            });

            recognition.onresult = (event) => {
                resetBtnState();
                const t = i18n[currentLang];
                const capturedText = event.results[0][0].transcript.toLowerCase().trim();

                if (capturedText.length > 0) {
                    voiceFeedback.innerText = t.success;
                    voiceFeedback.style.color = "#2E7D32"; 
                    voiceFeedback.style.backgroundColor = "#E8F5E9";
                    
                    playSuccessSFX(); 
                    triggerConfetti();
                    
                    setTimeout(() => { goToStep(3); }, 2000);
                } else {
                    voiceFeedback.innerText = t.failText + `"${capturedText}".` + t.failTryAgain;
                    voiceFeedback.style.color = "#C62828";
                    voiceFeedback.style.backgroundColor = "#FFEBEE";
                    playFailSFX(); 
                }
            };

            recognition.onend = () => {
                resetBtnState();
            };

            recognition.onerror = (event) => {
                resetBtnState();
                const t = i18n[currentLang];
                
                if (event.error !== 'aborted') {
                    voiceFeedback.innerText = t.error;
                    voiceFeedback.style.color = "#C62828";
                    voiceFeedback.style.backgroundColor = "#FFEBEE";
                    playFailSFX();
                }
            };

        } else {
            speakBtn.style.display = 'none';
            voiceFeedback.innerText = "Browser tidak mendukung rekam suara";
        }

        // --- RETRY (STEP 3) ---
        const retryBtn = document.getElementById('retryBtn');
        retryBtn.addEventListener('click', () => {
            initAudio();
            resetCanvas();
            voiceFeedback.innerText = "";
            voiceFeedback.style.backgroundColor = "transparent";
            goToStep(1);
        });

    </script>
</body>
</html>
