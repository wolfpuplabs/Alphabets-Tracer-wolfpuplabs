<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tracing Dots to AR</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #card-container, #ar-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 95%;
        }

        #ar-container {
            display: none;
            width: 400px;
            max-width: 100%;
        }

        /* PERBAIKAN UKURAN & BACKGROUND CANVAS */
        canvas {
            border: 2px solid #ccc;
            border-radius: 10px;
            touch-action: none; 
            cursor: crosshair;
            background-color: #f0f0f0; 
            background-image: url('letter_a_trace.png'); /* Nama file gambar yang baru */
            background-size: 100% 100%; 
            background-position: center;
            background-repeat: no-repeat;
        }

        model-viewer {
            width: 100%;
            height: 350px;
            background-color: #eee;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        h2 { color: #333; margin-bottom: 5px; }
        p { color: #666; margin-bottom: 20px; font-size: 14px; }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,123,255,0.3);
            transition: transform 0.2s, background-color 0.2s;
            flex: 1;
        }

        .btn:active { transform: scale(0.95); }
        .btn.recording { background-color: #FF3B30; box-shadow: 0 5px 15px rgba(255,59,48,0.3); }
        .btn-sound { background-color: #28a745; box-shadow: 0 5px 15px rgba(40,167,69,0.3); }

    </style>
</head>
<body>

    <div id="card-container">
        <h2>Langkah 1: Hubungkan Titik</h2>
        <p>Tarik garis (drag) mengikuti garis putus-putus.</p>
        <canvas id="tracingCanvas" width="350" height="400"></canvas>
    </div>

    <div id="ar-container">
        <h2>Langkah 2: AR & Suara</h2>
        
        <model-viewer 
            src="letter_A.glb" 
            alt="Model 3D Huruf A" 
            auto-rotate 
            camera-controls 
            ar 
            ar-modes="webxr scene-viewer quick-look">
        </model-viewer>

        <div class="btn-group">
            <button class="btn btn-sound" id="playSoundBtn">🔊 Dengar</button>
            <button class="btn" id="speakBtn">🎤 Ucapkan "A"</button>
        </div>
        <p id="voiceFeedback" style="margin-top: 15px; font-weight: bold; color: #28a745;"></p>
    </div>

    <script>
        // Unlock Audio untuk Safari iOS
        let audioUnlocked = false;
        function unlockAudio() {
            if (!audioUnlocked) {
                const unlockMsg = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(unlockMsg);
                audioUnlocked = true;
            }
        }
        document.body.addEventListener('touchstart', unlockAudio, { once: true });
        document.body.addEventListener('click', unlockAudio, { once: true });

        const canvas = document.getElementById('tracingCanvas');
        const ctx = canvas.getContext('2d');
        const cardContainer = document.getElementById('card-container');
        const arContainer = document.getElementById('ar-container');

        let isDrawing = false;

        // KOORDINAT BARU YANG DISESUAIKAN DENGAN GAMBAR LETTER_A_TRACE.PNG
        let checkpoints = [
            { x: 175, y: 50, hit: false },   // 1. Puncak Atas
            { x: 110, y: 220, hit: false },  // 2. Garis Kiri Atas
            { x: 60, y: 350, hit: false },   // 3. Kaki Kiri Bawah
            { x: 240, y: 220, hit: false },  // 4. Garis Kanan Atas
            { x: 290, y: 350, hit: false },  // 5. Kaki Kanan Bawah
            { x: 175, y: 240, hit: false }   // 6. Palang Tengah (Garis Horizontal)
        ];

        function drawCheckpoints() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            checkpoints.forEach(pt => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 12, 0, Math.PI * 2);
                ctx.fillStyle = pt.hit ? 'rgba(40,167,69,0.8)' : 'rgba(150,150,150,0.5)'; 
                ctx.fill();
            });
        }

        // Gambar titik-titik awal
        drawCheckpoints();

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            return { 
                x: (clientX - rect.left) * scaleX, 
                y: (clientY - rect.top) * scaleY 
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getCoordinates(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            
            const pos = getCoordinates(e);

            ctx.lineWidth = 18; // Ketebalan coretan disesuaikan
            ctx.lineCap = 'round';
            ctx.strokeStyle
